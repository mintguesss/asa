<script>
  /* 先套用上次選的亮／暗，避免載入時閃一下 */
  try { document.documentElement.dataset.style = (new URLSearchParams(location.search).get('style') || localStorage.getItem('style')) === 'simple' ? 'simple' : 'vivid'; } catch (e) {}
  try { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch (e) {}
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div id="aurora"></div>
<main>
  <div class="topbar">
    <div class="mtitle" id="mtitle"></div>
    <div class="cmd">
      <span class="spark">✦</span>
      <input id="cmd" autocomplete="off">
      <kbd>Ctrl K</kbd>
      <div id="pv" hidden></div>
    </div>
    <button class="tbtn actbtn" id="actbtn" hidden onclick="go('activity')"><svg viewBox="0 0 24 24" width="21" height="21"><path d="M4 5.5h16v10H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9.5h8M8 12.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="dot" hidden></span></button>
    <button class="tbtn theme-toggle" id="theme" aria-live="polite">
      <!-- 太陽／月亮圖示：改寫自 Adam Argyle 的 Theme Switch（web.dev GUI Challenges），見 vendor/theme-toggle.css -->
      <svg class="sun-and-moon" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24">
        <mask class="moon" id="moon-mask">
          <rect x="0" y="0" width="100%" height="100%" fill="white"/>
          <circle cx="24" cy="10" r="6" fill="black"/>
        </mask>
        <circle class="sun" cx="12" cy="12" r="6" mask="url(#moon-mask)" fill="currentColor"/>
        <g class="sun-beams" stroke="currentColor">
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </g>
      </svg>
    </button>
  </div>
  <div id="view"></div>
</main>
