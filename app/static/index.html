<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c1a">
<title>LifeHub</title>
<script>
  /* 先套用上次選的亮／暗，避免載入時閃一下 */
  try { document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/static/vendor/borderglow.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/vendor/theme-toggle.css">
</head>
<body>
<div id="aurora"></div>
<main>
  <div class="topbar">
    <div class="cmd">
      <span class="spark">✦</span>
      <input id="cmd" autocomplete="off">
      <kbd>Ctrl K</kbd>
      <div id="pv" hidden></div>
    </div>
    <button class="tbtn theme-toggle" id="theme" aria-live="polite">
      <!-- 太陽／月亮圖示：改寫自 Adam Argyle 的 Theme Switch（web.dev GUI Challenges），見 vendor/theme-toggle.css -->
      <svg class="sun-and-moon" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24">
        <mask class="moon" id="moon-mask">
          <rect x="0" y="0" width="100%" height="100%" fill="white"/>
          <circle cx="24" cy="10" r="6" fill="black"/>
        </mask>
        <circle class="sun" cx="12" cy="12" r="6" mask="url(#moon-mask)" fill="currentColor"/>
        <g class="sun-beams" stroke="currentColor">
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </g>
      </svg>
    </button>
  </div>
  <div id="view"></div>
</main>
<nav class="dock" id="rail"></nav>
<script src="/static/vendor/aurora.js"></script>
<script src="/static/vendor/borderglow.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
