<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Asa 鬧鐘</title>
<style>
  /* 鬧鐘響的時候的全螢幕畫面。App 用 WebView 載入；window.AsaAlarm 是 App 提供的介面。
     版面讓照片露最多：時間在右上角，下面只有播放動畫和一條答題列。 */
  :root { --ink: #fff; --soft: rgba(255,255,255,.82); --line: rgba(255,255,255,.2);
          --a1: #ff7a8a; --a2: #ffa77a; --a3: #8b5cf6; }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0b0a18; color: var(--ink); overflow: hidden;
    font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100%; }

  /* 背景：照片靠上對齊（臉通常在上面）；只有最上面和最下面加一點暗色 */
  .bg { position: fixed; inset: 0; background: linear-gradient(160deg, #2a1f6b, #7c3aed 40%, #ff5fa2 75%, #ffb347);
    background-size: cover; background-position: center 18%; animation: breathe 18s ease-in-out infinite alternate; }
  .bg.photo { background-image: var(--photo); }
  @keyframes breathe { from { transform: scale(1.02); } to { transform: scale(1.07); } }
  .shade { position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 58%, rgba(6,5,16,.5) 76%, rgba(6,5,16,.85) 100%); }
  .sh { text-shadow: 0 1px 3px rgba(0,0,0,.6), 0 2px 12px rgba(0,0,0,.5); }

  .wrap { position: relative; flex: 1; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 18px); }

  /* 上面：左邊是哪個鬧鐘，右邊是時間 */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; margin-top: 4px;
    background: rgba(12,10,28,.32); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); white-space: nowrap; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--a1); animation: ping 1.6s infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255,122,138,.7); } 70%, 100% { box-shadow: 0 0 0 7px rgba(255,122,138,0); } }
  .tm { text-align: right; }
  .clock { font-size: 62px; font-weight: 700; letter-spacing: -1px; line-height: 1; font-variant-numeric: tabular-nums; }
  .date, .rest { margin-top: 5px; font-size: 14px; color: var(--soft); }
  .rest { margin-top: 2px; }
  .skip { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; font-size: 15px; color: var(--soft); }
  .skip input { width: 22px; height: 22px; accent-color: #ff8f86; }
  .gap { flex: 1; min-height: 12px; }

  /* 播放中：置中，音波、歌名、歌手、進度（沒有底色，不擋照片） */
  .music { display: flex; flex-direction: column; align-items: center; margin-bottom: 18px; }
  .wave { display: flex; align-items: center; justify-content: center; gap: 4px; height: 60px; }
  .wave i { width: 3px; height: 6px; border-radius: 2px; background: linear-gradient(180deg, #fff, #ffd0dc);
    box-shadow: 0 0 10px rgba(255,150,180,.7); animation: eq var(--d, 1.1s) ease-in-out infinite; }
  @keyframes eq { 0%, 100% { height: 5px; opacity: .6; } 50% { height: var(--h, 50px); opacity: 1; } }
  .title { margin-top: 12px; font-size: 22px; font-weight: 800; letter-spacing: .3px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { margin-top: 3px; font-size: 14px; font-weight: 500; color: var(--soft); letter-spacing: .5px; }
  .prog { width: min(300px, 86%); margin-top: 12px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
    font-size: 11.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .track { height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); position: relative; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px; background: linear-gradient(90deg, #ffd0dc, #fff); transition: width 1s linear; }
  .fill::after { content: ""; position: absolute; right: -5px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 10px rgba(255,170,200,.9); }

  /* 題目和作答：一條膠囊 */
  .strip { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 14px; border-radius: 999px;
    background: rgba(12,10,28,.36); border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .strip.bad { animation: shake .35s; border-color: #ff6b7d; }
  @keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(7px); } 75% { transform: translateX(-4px); } }
  .sum { flex: none; font-size: 15px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ans { flex: 1; min-width: 44px; height: 36px; border: 0; border-radius: 999px; background: rgba(255,255,255,.12); color: #fff; padding: 0 10px;
    font: 600 16px/1 inherit; text-align: center; outline: none; font-variant-numeric: tabular-nums; }
  .ans::placeholder { color: rgba(255,255,255,.45); font-weight: 500; }
  .go { flex: none; height: 36px; padding: 0 14px; border: 0; border-radius: 999px; color: #fff; font: 700 14px/1 inherit; white-space: nowrap;
    background: linear-gradient(120deg, var(--a3), var(--a1) 55%, var(--a2)); box-shadow: 0 4px 14px rgba(255,122,138,.35); }
  .go:active { transform: scale(.96); }

  /* 起床確認：倒數小圈圈 */
  .ring { width: 32px; height: 32px; flex: none; position: relative; margin-left: -8px; }
  .ring svg { transform: rotate(-90deg); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .ask { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .in { animation: up .5s cubic-bezier(.2,.8,.2,1) both; }
  .d1 { animation-delay: .08s } .d2 { animation-delay: .16s }
  @keyframes up { from { opacity: 0; transform: translateY(12px); } }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="shade"></div>
<main class="wrap">
  <div class="top">
    <span class="pill in"><span class="dot"></span><span id="label"></span></span>
    <div class="tm sh in"><div class="clock" id="clock"></div><div class="date" id="date"></div><div class="rest" id="rest"></div></div>
  </div>
  <div class="gap"></div>
  <section id="main"></section>
</main>
<script>
const N = window.AsaAlarm || null;                // 在瀏覽器裡開（測試用）就沒有
let I = {};
try { I = JSON.parse(N ? N.info() : (window.MOCK || '{}')); } catch (e) { I = {}; }
const ZH = (I.lang || navigator.language || 'zh').startsWith('zh');
const T = (zh, en) => ZH ? zh : en;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const toast = m => N ? N.toast(m) : console.log(m);
const pad = n => String(n).padStart(2, '0');

if (I.bg) { document.documentElement.style.setProperty('--photo', `url("${I.bg}")`); $('#bg').classList.add('photo'); }
const n = I.n || 1;
$('#label').textContent = I.check ? T('起床確認', 'Wake check')
  : (I.label || T('起床', 'Wake up')) + (n > 1 ? T(` · 第 ${n} 個`, ` · #${n}`) : '');
if (!I.check) $('#rest').textContent = I.rest ? T(`還有 ${I.rest} 個 · 下一個 ${I.next}`, `${I.rest} more · next ${I.next}`) : T('最後一個了', 'Last one');

const WD = ZH ? ['日', '一', '二', '三', '四', '五', '六'] : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const clock = () => {
  const d = new Date();
  $('#clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $('#date').textContent = ZH ? `${d.getMonth() + 1}/${d.getDate()} 星期${WD[d.getDay()]}` : `${WD[d.getDay()]} ${d.getMonth() + 1}/${d.getDate()}`;
};

/* 兩位數 + 兩位數；第 3 個起個位數一定會進位，稍微難一點 */
const r = (a, b) => a + Math.floor(Math.random() * (b - a));
function puzzle(n) {
  let a, b;
  do { a = r(11, 100); b = r(11, 100); } while (n >= 3 && (a % 10) + (b % 10) < 10);
  return [`${a} + ${b}`, a + b];
}

/* 音波：中間高、兩邊低，每條速度不一樣 */
const music = () => {
  const K = 35;
  const bars = Array.from({length: K}, (_, i) => {
    const x = Math.abs(i - (K - 1) / 2) / ((K - 1) / 2);              // 0 = 中間，1 = 兩邊
    const h = Math.round(10 + 48 * Math.cos(x * Math.PI / 2) ** 1.4 * (0.7 + 0.3 * ((i * 7) % 5) / 4));
    return `<i style="--h:${h}px;--d:${(0.8 + ((i * 13) % 7) / 10).toFixed(2)}s;animation-delay:${-((i * 0.29) % 1.2).toFixed(2)}s"></i>`;
  }).join('');
  // 檔名「歌手 - 歌名」拆成兩行；沒有「 - 」就整個當歌名
  const name = I.sound || T('預設鬧鐘鈴聲', 'Default alarm');
  const [artist, title] = name.includes(' - ') ? [name.split(' - ')[0], name.split(' - ').slice(1).join(' - ')] : [I.sound ? '' : 'Asa', name];
  return `<div class="music sh in d1"><div class="wave">${bars}</div>
    <div class="title">${esc(title)}</div>${artist ? `<div class="artist">${esc(artist)}</div>` : ''}
    <div class="prog"><span id="el">0:00</span><div class="track"><div class="fill" id="fill"></div></div><span id="len">3:00</span></div></div>`;
};

function alarm() {
  const [q, ans] = puzzle(n);
  $('#main').innerHTML = `${music()}
    <form class="strip in d2" id="f" autocomplete="off">
      <span class="sum">${q} =</span>
      <input class="ans" id="a" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" placeholder="?" aria-label="${T('答案', 'Answer')}">
      <button class="go">${T('我醒了', 'I\'m up')}</button></form>
    ${I.today ? `<label class="skip in d2"><input type="checkbox" id="sk"> ${T(`今天後面的 ${I.today} 個也關掉`, `Also turn off today's ${I.today} remaining`)}</label>` : ''}`;
  $('#f').onsubmit = e => {
    e.preventDefault();
    const a = $('#a'), f = $('#f');
    const sk = !!($('#sk') && $('#sk').checked);
    if (a.value.trim() === String(ans)) { N ? (N.awake2 ? N.awake2(sk) : N.awake()) : toast('awake ' + sk); return; }
    a.value = ''; f.classList.remove('bad'); void f.offsetWidth; f.classList.add('bad');
    toast(T('答錯了，再算一次', 'Wrong answer, try again'));
  };
}

function check() {
  const C = 2 * Math.PI * 13;
  $('#main').innerHTML = `${music()}
    <div class="strip in d2">
      <div class="ring"><svg width="32" height="32"><circle cx="16" cy="16" r="13" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="3"/>
        <circle id="arc" cx="16" cy="16" r="13" fill="none" stroke="#ff8f86" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C}" style="transition:stroke-dashoffset 1s linear"/></svg><b id="left">60</b></div>
      <div class="ask">${T('還醒著嗎？沒按就大聲響', 'Still awake? Or it rings loudly')}</div>
      <button class="go" id="ok">${T('我醒著 ✓', 'I\'m up ✓')}</button></div>`;
  $('#ok').onclick = () => N ? N.checkOk() : toast('ok');
  const t0 = Date.now() - (I.since || 0);
  const step = () => {
    const left = Math.max(0, 60 - Math.floor((Date.now() - t0) / 1000));
    $('#left').textContent = left;
    $('#arc').style.strokeDashoffset = C * (1 - left / 60);
  };
  step(); setInterval(step, 1000);
}

(I.check ? check : alarm)();
clock(); setInterval(clock, 1000);
const t0 = Date.now() - (I.since || 0);
const tickEl = () => {                               // 已經響了多久；進度 3 分鐘一圈（裝飾）
  const s = Math.floor((Date.now() - t0) / 1000), el = $('#el'), f = $('#fill');
  if (el) el.textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`;
  if (f) f.style.width = `${(s % 180) / 1.8}%`;
};
tickEl(); setInterval(tickEl, 1000);
</script>
</body>
</html>
